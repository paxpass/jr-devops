name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: composer install
      - run: php artisan test

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: aquasecurity/trivy-action@master
        with:
          image-ref: secure-drop:latest

  build:
    runs-on: ubuntu-latest
    steps:
      - run: docker build -t ghcr.io/USERNAME/secure-drop .
      - run: docker push ghcr.io/USERNAME/secure-drop